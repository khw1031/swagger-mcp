# Smithery configuration for @hynu/swagger-mcp
# https://smithery.ai/docs/build/project-config/smithery-yaml

runtime: "typescript"

startCommand:
  type: "http"
  configSchema:
    type: "object"
    properties:
      services:
        type: "array"
        description: "List of Swagger/OpenAPI service configurations"
        items:
          type: "object"
          properties:
            name:
              type: "string"
              description: "Service name"
            environment:
              type: "string"
              description: "Environment (e.g. dev, stg, prod)"
            description:
              type: "string"
              description: "Service description (optional)"
            url:
              type: "string"
              format: "uri"
              description: "Swagger/OpenAPI document URL"
          required:
            - "name"
            - "environment"
            - "url"
    required:
      - "services"
  exampleConfig:
    services:
      - name: "petstore"
        environment: "prod"
        description: "Swagger Petstore API"
        url: "https://petstore3.swagger.io/api/v3/openapi.json"
